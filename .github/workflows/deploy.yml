name: Deploy SAM
on:
  push:
    branches: [main]
    inputs:
      environment:
        description: Environment
        default: dev
        type: string
    # paths:
    #   - 'src/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: aws-actions/setup-sam@v2
      - run: sam build
      - run: sam deploy --config-env ${{ inputs.environment || 'dev' }} --no-confirm-changeset --no-fail-on-empty-changeset
